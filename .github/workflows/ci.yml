name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: dart test
        working-directory: packages/glance_protocol
      - run: dart test
        working-directory: packages/glance_telemetry
      - run: flutter test
        working-directory: packages/glance_maps
      - run: flutter test
        working-directory: apps/hmi
