name: glance
description: Glance HMI dashboard and Glance Studio.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.3
  flutter_riverpod: ^3.4.3
  glance_maps:
    path: ../../packages/glance_maps
  glance_protocol:
    path: ../../packages/glance_protocol
  glance_telemetry:
    path: ../../packages/glance_telemetry
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  path_provider_foundation: ">=2.5.1 <2.6.0"
  night_road:
    path: ../../packages/night_road
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/vehicles/
